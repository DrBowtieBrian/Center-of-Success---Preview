<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#1B2A1F" />
<title>Center of Success — Character. Trust. Service.</title>
<meta name="description" content="A character operating system for individuals, teams, and organizations. Turn pressure into discernment, ownership, faithful action, restored trust, and measurable service." />
<style>
/* ============================================================
   CENTER OF SUCCESS — DESIGN SYSTEM
   ============================================================ */
:root{
  /* Core palette (from the brand board) */
  --forest:#1B2A1F;
  --forest-deep:#132018;
  --forest-soft:#25382A;
  --moss:#4A5A40;
  --moss-light:#6B7A5A;
  --bark:#3A2A20;
  --clay:#8C3B2E;
  --tan:#C58B4A;
  --gold:#B8892B;
  --gold-light:#D8B45F;
  --sand:#E8DCC4;
  --parchment:#FAF7F0;
  --paper:#FFFDF8;
  --ink:#1C1B19;
  --slate:#3E4A5C;

  /* Semantic */
  --bg:var(--parchment);
  --surface:var(--paper);
  --text:var(--ink);
  --text-2:rgba(28,27,25,.66);
  --text-3:rgba(28,27,25,.44);
  --line:rgba(28,27,25,.10);
  --line-2:rgba(28,27,25,.06);

  /* Elevation */
  --sh-1:0 1px 2px rgba(28,27,25,.04), 0 2px 8px rgba(28,27,25,.04);
  --sh-2:0 2px 6px rgba(28,27,25,.05), 0 12px 28px rgba(28,27,25,.07);
  --sh-3:0 8px 20px rgba(28,27,25,.08), 0 30px 70px rgba(28,27,25,.14);

  /* Shape */
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;

  /* Type */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Helvetica,Arial,sans-serif;

  /* Motion */
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--forest-deep);color:var(--text);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4,.display{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
p{margin:0}
::-webkit-scrollbar{width:0;height:0}

/* ---------- Desktop staging: device frame ---------- */
.stage{min-height:100%;display:grid;place-items:center;padding:0;position:relative}
.stage::before{
  content:"";position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120% 80% at 15% 0%, rgba(184,137,43,.16), transparent 60%),
    radial-gradient(100% 70% at 90% 100%, rgba(74,90,64,.35), transparent 62%),
    linear-gradient(160deg,#16241A,#0F1913 70%);
}
.stage-aside{display:none}

.device{
  position:relative;z-index:1;width:100%;max-width:480px;height:100dvh;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
}
@media(min-width:900px){
  .stage{grid-template-columns:1fr auto 1fr;gap:0;padding:40px}
  .stage-aside{
    display:block;position:relative;z-index:1;max-width:420px;
    color:var(--parchment);padding:0 48px 0 8px;grid-column:1;justify-self:end;
  }
  .stage-aside .mark{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .stage-aside h1{font-size:44px;line-height:1.03;color:#fff;letter-spacing:-.02em}
  .stage-aside .rule{width:52px;height:1px;background:var(--gold);margin:22px 0}
  .stage-aside .tagline{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--gold-light);margin-bottom:18px}
  .stage-aside p{color:rgba(250,247,240,.72);font-size:15px;line-height:1.65}
  .stage-aside .pillars{margin-top:30px;display:grid;gap:14px}
  .stage-aside .pillar{display:flex;gap:12px;align-items:center;font-size:14px}
  .stage-aside .pillar b{display:block;letter-spacing:.06em;font-size:12px;text-transform:uppercase;color:var(--gold-light)}
  .stage-aside .pillar span{color:rgba(250,247,240,.6)}
  .device{
    grid-column:2;height:min(880px,calc(100dvh - 80px));border-radius:44px;
    box-shadow:var(--sh-3), 0 0 0 10px #0C130E, 0 0 0 11px rgba(184,137,43,.22);
  }
  .device::after{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#0C130E;border-radius:0 0 16px 16px;z-index:60;pointer-events:none;
  }
  .device>.statusbar{display:flex}
}

/* ---------- Status bar (desktop device only) ---------- */
.statusbar{
  display:none;justify-content:space-between;align-items:center;min-height:34px;
  padding:13px 26px 4px;font-size:13px;font-weight:600;letter-spacing:-.01em;flex:0 0 auto;
}
.statusbar .sb-right{display:flex;gap:5px;align-items:center;opacity:.85}

/* ---------- App chrome ---------- */
.appbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px 12px;background:var(--bg);position:relative;z-index:20;
  transition:background .3s var(--ease), color .3s var(--ease);
}
.appbar.on-dark{background:transparent;color:var(--parchment)}
.appbar-title{text-align:center;flex:1;min-width:0}
.appbar-title b{display:block;font-family:var(--serif);font-size:17px;letter-spacing:.14em;font-weight:600}
.appbar-title small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-top:1px}
.appbar.on-dark .appbar-title small{color:rgba(250,247,240,.55)}
.icon-btn{
  width:38px;height:38px;border-radius:var(--r-full);display:grid;place-items:center;
  background:rgba(28,27,25,.045);transition:.18s var(--ease);flex:0 0 auto;
}
.icon-btn:active{transform:scale(.92);background:rgba(28,27,25,.09)}
.appbar.on-dark .icon-btn{background:rgba(255,255,255,.1)}
.icon-btn .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--clay);transform:translate(11px,-10px);border:2px solid var(--bg)}

/* ---------- Scroll body ---------- */
.screen{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:4px 18px 120px;position:relative;
}
.screen.flush{padding-left:0;padding-right:0}
.screen.dark{background:linear-gradient(175deg,#2C231A,#1A140F 60%)}
.view{animation:viewIn .38s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:viewIn .45s var(--ease-out) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.1s}
.stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(5){animation-delay:.18s}
.stagger>*:nth-child(6){animation-delay:.22s}
.stagger>*:nth-child(7){animation-delay:.26s}

/* ---------- Typography helpers ---------- */
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.eyebrow.gold{color:var(--gold)}
.eyebrow.moss{color:var(--moss)}
.greeting{font-family:var(--serif);font-size:31px;line-height:1.14;letter-spacing:-.02em;margin:2px 0 6px}
.sub{color:var(--text-2);font-size:14.5px;line-height:1.55}
.muted{color:var(--text-2)}
.tiny{font-size:12px}
.small{font-size:13.5px}
.serif{font-family:var(--serif)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 2px 12px}
.section-h h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--sans);font-weight:700;color:var(--text-3)}
.section-h button{font-size:12.5px;color:var(--moss);font-weight:600}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--sh-1);
}
.card.tight{padding:14px}
.card.flat{box-shadow:none;background:rgba(255,255,255,.5)}
.tap{transition:transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease)}
.tap:active{transform:scale(.985);box-shadow:var(--sh-1)}

.rowcard{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 15px;box-shadow:var(--sh-1);margin-bottom:9px;
}
.rowcard .glyph{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(150deg,rgba(74,90,64,.14),rgba(184,137,43,.1));color:var(--moss);
}
.rowcard b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.rowcard span{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.4}
.rowcard .chev{margin-left:auto;color:var(--text-3);flex:0 0 auto}

/* ---------- Hero / feature card ---------- */
.feature{
  position:relative;border-radius:var(--r-xl);overflow:hidden;color:var(--parchment);
  padding:26px 22px 22px;box-shadow:var(--sh-2);isolation:isolate;
}
.feature::before{
  content:"";position:absolute;inset:0;z-index:-2;
  background:linear-gradient(150deg,#3B2E20,#241A12 62%,#1A1410);
}
.feature::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(90% 60% at 80% 10%, rgba(197,139,74,.28), transparent 60%);
}
.feature h2{font-size:27px;line-height:1.15;margin:12px 0 10px;letter-spacing:-.02em}
.feature p{color:rgba(250,247,240,.72);font-size:14px;line-height:1.55}
.feature .eyebrow{color:var(--gold-light)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 20px;border-radius:var(--r-full);font-size:15px;font-weight:600;
  background:var(--moss);color:var(--parchment);transition:.18s var(--ease);
  box-shadow:0 2px 10px rgba(74,90,64,.24);
}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(140deg,var(--gold-light),var(--gold));color:#221803;box-shadow:0 2px 12px rgba(184,137,43,.3)}
.btn.light{background:rgba(250,247,240,.94);color:var(--forest);box-shadow:none}
.btn.quiet{background:rgba(28,27,25,.05);color:var(--text);box-shadow:none}
.btn.sm{padding:9px 14px;font-size:13.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.textbtn{font-size:14px;font-weight:600;color:var(--moss);padding:10px}

/* ---------- Chips / pills ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);border-radius:var(--r-full);padding:6px 11px;
  font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface);transition:.16s var(--ease);
}
.chip.on{background:var(--forest);color:var(--parchment);border-color:var(--forest)}
.tagpill{
  display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-full);
  padding:4px 9px;font-size:11px;font-weight:600;letter-spacing:.02em;
  background:rgba(74,90,64,.1);color:var(--moss);
}
.tagpill.gold{background:rgba(184,137,43,.14);color:#8A6414}
.tagpill.clay{background:rgba(140,59,46,.1);color:var(--clay)}
.tagpill.slate{background:rgba(62,74,92,.1);color:var(--slate)}

/* ---------- Stats ---------- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px;box-shadow:var(--sh-1);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
}
.stat .label{font-size:11.5px;color:var(--text-2);line-height:1.3}
.stat .num{font-family:var(--serif);font-size:30px;line-height:1;margin-top:8px;letter-spacing:-.02em}
.stat .delta{font-size:11px;color:var(--moss);font-weight:600;margin-top:6px}
.stat .delta.down{color:var(--clay)}

.ring{position:relative;width:46px;height:46px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;font-weight:700;letter-spacing:-.02em;
}

/* ---------- Progress ---------- */
.bar{height:6px;border-radius:var(--r-full);background:rgba(28,27,25,.08);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--moss),var(--gold));transition:width .8s var(--ease-out)}
.stepdots{display:flex;gap:5px}
.stepdots i{height:3px;flex:1;border-radius:2px;background:rgba(250,247,240,.2)}
.stepdots i.on{background:var(--gold-light)}

/* ---------- Bottom tab bar ---------- */
.tabbar{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  background:rgba(250,247,240,.86);backdrop-filter:blur(20px) saturate(1.4);
  border-top:1px solid var(--line);position:relative;z-index:30;
}
.tab{display:grid;justify-items:center;gap:4px;padding:5px 2px;border-radius:14px;color:var(--text-3);transition:.2s var(--ease)}
.tab b{font-size:10px;font-weight:600;letter-spacing:.01em}
.tab.on{color:var(--moss)}
.tab.on svg{transform:translateY(-1px)}
.tab:active{background:rgba(28,27,25,.04)}

/* ---------- Sheets & overlays ---------- */
.overlay{
  position:absolute;inset:0;z-index:70;background:rgba(19,32,24,.42);
  backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .28s var(--ease);
}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:80;background:var(--bg);
  border-radius:26px 26px 0 0;box-shadow:0 -10px 50px rgba(19,32,24,.28);
  transform:translateY(101%);transition:transform .38s var(--ease-out);
  max-height:88%;display:flex;flex-direction:column;
}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:rgba(28,27,25,.16);margin:10px auto 4px;flex:0 0 auto}
.sheet-body{overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom))}

/* Full-screen flow (SOIL check, Trust Loop) */
.flow{
  position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .42s var(--ease-out);
  background:var(--bg);
}
.flow.on{transform:none}
.flow.dark{background:linear-gradient(170deg,#2E2419,#171109 70%);color:var(--parchment)}
.flow-top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:16px 18px 8px}
.flow-top .eyebrow{flex:1;text-align:center}
.flow-body{flex:1 1 auto;overflow-y:auto;padding:8px 20px 24px}
.flow-foot{flex:0 0 auto;padding:12px 20px calc(18px + env(safe-area-inset-bottom));display:grid;gap:9px}

/* ---------- Toast ---------- */
.toast{
  position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:95;
  background:var(--forest);color:var(--parchment);padding:11px 16px;border-radius:var(--r-full);
  font-size:13px;font-weight:600;box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:.28s var(--ease);white-space:nowrap;max-width:88%;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Journal ---------- */
.searchbar{
  display:flex;align-items:center;gap:9px;background:rgba(28,27,25,.05);
  border-radius:var(--r-full);padding:10px 14px;margin-bottom:14px;
}
.searchbar input{flex:1;background:none;border:0;outline:none;font-size:14.5px}
.searchbar input::placeholder{color:var(--text-3)}
.entry{display:flex;gap:13px;padding:14px;margin-bottom:9px}
.entry .thumb{
  width:52px;height:60px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(155deg,#3E4F3A,#26301F);color:var(--gold-light);
}
.entry h4{font-size:15px;line-height:1.25;margin-bottom:4px}
.entry .meta{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* ---------- Trust loop diagram ---------- */
.loopwrap{display:grid;place-items:center;padding:6px 0 14px}
.loop-svg text{font-family:var(--serif);fill:var(--text)}
.loop-svg .lbl{font-size:15px;font-weight:600}
.loop-svg .sub{font-size:9px;font-family:var(--sans);fill:var(--text-3);letter-spacing:.04em}

/* ---------- Rafiki ---------- */
.rafiki-msg{display:flex;gap:11px;margin-bottom:14px;align-items:flex-start}
.rafiki-av{
  width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(150deg,#6B5A3E,#3A2E1E);color:var(--gold-light);font-size:18px;
}
.bubble{
  background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;
  padding:12px 14px;font-size:14px;line-height:1.55;box-shadow:var(--sh-1);
}
.bubble.me{background:var(--forest);color:var(--parchment);border-color:transparent;border-radius:16px 4px 16px 16px;margin-left:auto;max-width:82%}
.suggest{
  width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-full);padding:11px 15px;font-size:13.5px;margin-bottom:8px;box-shadow:var(--sh-1);
}
.composer{display:flex;gap:8px;align-items:center;background:rgba(28,27,25,.05);border-radius:var(--r-full);padding:6px 6px 6px 16px}
.composer input{flex:1;background:none;border:0;outline:none;font-size:14.5px}
.composer .send{width:36px;height:36px;border-radius:50%;background:var(--moss);color:var(--parchment);display:grid;place-items:center;flex:0 0 auto}

/* ---------- Option buttons (SOIL) ---------- */
.opt{
  width:100%;text-align:left;border-radius:var(--r-md);padding:15px 16px;margin-bottom:9px;
  background:rgba(250,247,240,.07);border:1px solid rgba(250,247,240,.14);color:var(--parchment);
  font-size:15px;font-weight:500;transition:.18s var(--ease);
}
.opt:active{transform:scale(.985)}
.opt.on{background:rgba(216,180,95,.16);border-color:var(--gold-light);color:#fff}
.opt small{display:block;font-size:12px;opacity:.6;margin-top:3px;font-weight:400}

/* ---------- Restoration path ---------- */
.path-step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.path-step:last-child{border-bottom:0}
.path-num{
  width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:rgba(74,90,64,.12);color:var(--moss);font-size:11.5px;font-weight:700;margin-top:2px;
}
.path-step b{display:block;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.path-step p{font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.5}

/* ---------- Academy ---------- */
.lesson{display:flex;align-items:center;gap:13px;padding:13px 15px}
.lesson .num{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(184,137,43,.13);color:var(--gold);font-size:13px;font-weight:700;flex:0 0 auto}
.key-card{padding:16px;margin-bottom:10px}
.key-card .route{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--clay);font-weight:600}
.key-card h3{font-size:21px;margin:5px 0 6px}
.chain-letter{display:flex;gap:12px;padding:9px 0;align-items:flex-start}
.chain-letter .l{font-family:var(--serif);color:var(--gold);font-size:19px;width:20px;flex:0 0 auto;line-height:1.2}
.chain-letter b{font-size:14px;font-weight:600}

/* ---------- Circles ---------- */
.avatars{display:flex}
.avatars span{
  width:24px;height:24px;border-radius:50%;margin-left:-7px;border:2px solid var(--surface);
  display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--parchment);background:var(--moss);
}
.avatars span:first-child{margin-left:0}
.avatars span:nth-child(2){background:var(--bark)}
.avatars span:nth-child(3){background:var(--slate)}
.avatars span:nth-child(4){background:var(--clay)}

/* ---------- Misc ---------- */
.divider{height:1px;background:var(--line);margin:18px 0}
.quote-block{
  font-family:var(--serif);font-size:19px;line-height:1.4;letter-spacing:-.01em;
  padding-left:16px;border-left:2px solid var(--gold);color:var(--text);
}
.empty{text-align:center;padding:46px 20px;color:var(--text-3)}
.empty svg{opacity:.35;margin-bottom:12px}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

/* ---- Derived metrics ---- */
function within(ts, days){ return Date.now() - ts <= days*86400000; }
const LOOP_GOAL = 5;   // loops that make a full week
function metrics(){
  const loopsWeek = S.loops.filter(l=>within(l.ts,7)).length;
  const loopsPrev = S.loops.filter(l=>!within(l.ts,7) && within(l.ts,14)).length;
  const soil = S.entries.filter(e=>e.kind==='SOIL Check');
  const avoided = soil.filter(e=>e.diagnosis==='unnecessary' && within(e.ts,14)).length;
  const vals = Object.values(S.skills);
  const alignment = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);

  // Loop goal progress: how much of the week's rhythm is complete.
  const loopPct = Math.min(100, Math.round(loopsWeek/LOOP_GOAL*100));

  // Rhythm kept: distinct days in the last 7 with at least one practice.
  const days = new Set();
  S.entries.concat(S.loops).forEach(x=>{ if(within(x.ts,7)) days.add(new Date(x.ts).toDateString()); });
  const rhythm = Math.round(days.size/7*100);

  return {loopsWeek, loopsPrev, loopsDelta:loopsWeek-loopsPrev, loopPct, avoided,
          alignment, rhythm, rhythmDays:days.size, soilCount:soil.length};
}
function grade(n){ return n>=85?'Excellent' : n>=75?'Good' : n>=60?'Building' : 'Early'; }

function greetingWord(){
  const h = new Date().getHours();
  return h<12 ? 'Good morning' : h<17 ? 'Good afternoon' : 'Good evening';
}
function relTime(ts){
  const d = Date.now()-ts, day = 86400000;
  if(d < day/2) return 'Today';
  if(d < day*1.8) return 'Yesterday';
  const dt = new Date(ts);
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function ringSVG(pct, size=46, sw=4, color='#4A5A40'){
  const r = (size-sw)/2, c = 2*Math.PI*r, off = c*(1-pct/100);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(28,27,25,.09)" stroke-width="${sw}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <span class="val">${pct}%</span></div>`;
}
function emptyState(ic, msg){
  return `<div class="empty">${icon(ic,34,1.4)}<p class="small">${msg}</p></div>`;
}
function entryCard(e){
  const dg = e.diagnosis ? DIAGNOSES[e.diagnosis] : null;
  return `<button class="card entry tap" style="width:100%;text-align:left" onclick="openEntry('${e.id}')">
    <span class="thumb">${icon(e.kind==='Trust Loop'?'loop':'leaf',22)}</span>

      <span class="meta">
        <span class="tagpill ${e.kind==='Trust Loop'?'slate':''}">${e.kind}</span>
        ${dg?`<span class="tagpill ${dg.tone==='clay'?'clay':'gold'}">${dg.name}</span>`:''}

    </span>
  </button>`;
}

function derivePatterns(){
  const out = [];
  const soil = S.entries.filter(e=>e.kind==='SOIL Check');
  const unnec = soil.filter(e=>e.diagnosis==='unnecessary').length;
  const unclear = soil.filter(e=>e.diagnosis==='unclear').length;
  if(unnec) out.push(`Pressure from unclear ownership appeared in ${unnec} recent check${unnec>1?'s':''}.`);
  if(unclear) out.push('Responsibility is being assumed rather than agreed. Ask who owns the outcome.');
  const weakest = Object.entries(S.skills).sort((a,b)=>a[1]-b[1])[0];
  out.push(`${weakest[0]} is your current growth edge — train it before the moment asks for it.`);
  if(S.loops.filter(l=>within(l.ts,7)).length < 3) out.push('Fewer loops closed this week. Reporting is where trust is built.');
  else out.push('You are closing loops consistently. Protect that rhythm.');
  return out;
}

      ${q.opts.map((o,ix)=>`
        <button class="opt ${soil.answers[soil.i]===ix?'on':''}" onclick="answerSoil(${ix})">
          ${o[0]}<small>${o[1]}</small>
        </button>`).join('')}
    </div>
    <div class="flow-foot">
      ${soil.i>0?`<button class="textbtn" style="color:rgba(250,247,240,.6)" onclick="soilBack()">Back</button>`:''}
    </div>`);
}
function restartSoil(){ soil = {i:0, answers:[]}; renderSoil(); }
function soilBack(){ if(soil.i>0){ soil.i--; renderSoil(); } }

function answerSoil(ix){
  soil.answers[soil.i] = ix;
  setTimeout(()=>{
    if(soil.i < SOIL_Q.length-1){ soil.i++; renderSoil(); }
    else soilResult();
  }, 190);
  renderSoil();
}

function soilScore(){
  return soil.answers.reduce((a,ix,qi)=> a + SOIL_Q[qi].opts[ix][2], 0);
}
function soilDiagnosisKey(){
  const s = soilScore();
  return s >= 5 ? 'unnecessary' : s >= 2 ? 'unclear' : 'rightful';
}

function soilResult(){
  const key = soilDiagnosisKey();
  const d = DIAGNOSES[key];
  setFlow(`
    <div class="flow-top">
      <button class="icon-btn" style="background:rgba(255,255,255,.1);color:var(--parchment)" onclick="soilBack2()">${icon('back',18)}</button>
      <span class="eyebrow" style="color:rgba(250,247,240,.6)">Result</span>
      <button class="icon-btn" style="background:rgba(255,255,255,.1);color:var(--parchment)" onclick="closeFlow()">${icon('close',18)}</button>
    </div>
    <div class="flow-body">
      <div style="text-align:center;padding:14px 4px 20px">
        <p style="color:rgba(250,247,240,.6);font-size:14px">This appears to be</p>
        <h2 class="serif" style="font-size:33px;line-height:1.1;margin:8px 0 10px">${d.name}</h2>
        <p style="color:rgba(250,247,240,.66);font-size:14.5px;line-height:1.55;max-width:300px;margin-inline:auto">${d.lede}</p>
      </div>
      ${d.rows.map(([ic,label,val])=>`
        <div style="display:flex;align-items:center;gap:13px;background:rgba(250,247,240,.06);border:1px solid rgba(250,247,240,.12);border-radius:16px;padding:14px 15px;margin-bottom:9px">
          <span style="color:var(--gold-light)">${icon(ic,19)}</span>

      <div style="margin-top:20px;border-radius:18px;padding:18px;background:rgba(216,180,95,.08);border:1px solid rgba(216,180,95,.2)">

        <div style="margin-top:12px;display:grid;gap:9px">

      </div>

      <button class="btn gold block" onclick="openRestoration(true)">View Next Steps</button>

}
function soilBack2(){ soil.i = SOIL_Q.length-1; renderSoil(); }

function saveSoil(){
  const key = soilDiagnosisKey();
  const d = DIAGNOSES[key];
  const e = {
    id:'e'+Date.now(), ts:Date.now(), kind:'SOIL Check', diagnosis:key,
    title:d.name+' identified',
    body:d.lede+' Next: '+d.response[0],
    mood:'Aware', tags:['Respect']
  };
  S.entries.unshift(e);
  if(key==='unnecessary') S.skills.Respect = Math.min(100, S.skills.Respect+1);
  S.skills.Explore = Math.min(100, S.skills.Explore+1);
  save();
  closeFlow();
  toast('Saved to your journal');
  setTimeout(()=>{ go('today'); }, 260);
}

/* ============================================================
   TRUST LOOP FLOW
   ============================================================ */
let loopState = null;
function startLoop(){
  loopState = {i:0, notes:['','','','']};
  openFlow('', false);
  renderLoop();
}
function renderLoop(){
  const [name, verb, q, hint] = LOOP_STEPS[loopState.i];
  setFlow(`
    <div class="flow-top" style="color:var(--text)">
      <button class="icon-btn" onclick="closeFlow()">${icon('close',18)}</button>
      <span class="eyebrow">Trust Loop</span>
      <span style="width:38px"></span>
    </div>
    <div class="flow-body">
      <div class="loopwrap">${loopSVG(loopState.i)}</div>
      <p class="eyebrow moss" style="text-align:center">${name} · ${verb}</p>
      <h2 class="serif" style="font-size:25px;text-align:center;margin:10px 0 6px">${q}</h2>
      <p class="sub" style="text-align:center;margin-bottom:16px">${hint}</p>
      <textarea id="loopNote" placeholder="Write what is true…" style="width:100%;min-height:150px;resize:vertical;border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:15px;font-size:15px;line-height:1.55;outline:none;box-shadow:var(--sh-1)">${loopState.notes[loopState.i]}</textarea>
      <div class="stepdots" style="margin-top:16px">${LOOP_STEPS.map((_,i)=>`<i class="${i<=loopState.i?'on':''}" style="background:${i<=loopState.i?'var(--moss)':'rgba(28,27,25,.12)'}"></i>`).join('')}</div>
    </div>
    <div class="flow-foot">
      <button class="btn block" onclick="loopNext()">${loopState.i<3?'Continue':'Close the loop'} ${icon('arrow',15)}</button>
      ${loopState.i>0?`<button class="textbtn" onclick="loopBack()">Back</button>`:''}
    </div>`);
}
function captureLoop(){
  const t = el('loopNote'); if(t) loopState.notes[loopState.i] = t.value;
}
function loopBack(){ captureLoop(); loopState.i--; renderLoop(); }
function loopNext(){
  captureLoop();
  if(loopState.i < 3){ loopState.i++; renderLoop(); return; }
  const said = loopState.notes[0].trim();
  S.loops.unshift({ts:Date.now()});
  S.entries.unshift({
    id:'e'+Date.now(), ts:Date.now(), kind:'Trust Loop',
    title: said ? (said.length>52 ? said.slice(0,52)+'…' : said) : 'Closed a loop',
    body: loopState.notes[3].trim() || loopState.notes[2].trim() || 'Loop closed.',
    mood:'Steady', tags:['Communication']
  });
  S.skills.Communication = Math.min(100, S.skills.Communication+1);
  S.skills.Teamwork = Math.min(100, S.skills.Teamwork+1);
  S.streak += 0;
  save();
  closeFlow();
  toast('Loop closed. Trust compounds.');
  setTimeout(()=>go('dashboard'), 280);
}

function loopSVG(active){
  const pts = [[110,26,'SAY','I intend'],[194,110,'DO','I act'],[110,194,'DID','What happened'],[26,110,'SAID','I report']];
  return `<svg class="loop-svg" width="220" height="220" viewBox="0 0 220 220">
    <circle cx="110" cy="110" r="72" fill="none" stroke="rgba(28,27,25,.12)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="110" cy="110" r="72" fill="none" stroke="#B8892B" stroke-width="2.5" stroke-linecap="round"
      stroke-dasharray="${2*Math.PI*72}" stroke-dashoffset="${2*Math.PI*72*(1-(active+1)/4)}"
      transform="rotate(-90 110 110)" opacity=".85"/>
    ${pts.map(([x,y,l,s],i)=>`
      <circle cx="${x}" cy="${y}" r="21" fill="${i===active?'#4A5A40':'#FFFDF8'}" stroke="${i<=active?'#B8892B':'rgba(28,27,25,.12)'}" stroke-width="1.5"/>
      <text x="${x}" y="${y+2}" text-anchor="middle" class="lbl" style="fill:${i===active?'#FAF7F0':'#1C1B19'};font-size:12px">${l}</text>
      <text x="${x}" y="${y+14}" text-anchor="middle" class="sub" style="fill:${i===active?'rgba(250,247,240,.7)':'rgba(28,27,25,.42)'}">${s}</text>`).join('')}
    <text x="110" y="106" text-anchor="middle" class="sub" style="font-size:10px">TRUST =</text>
    <text x="110" y="122" text-anchor="middle" class="lbl" style="font-size:13px">Integrity ×</text>
    <text x="110" y="137" text-anchor="middle" class="lbl" style="font-size:13px">Accountability</text>
  </svg>`;
}

    return okF && okQ;
  });
  return `

      <button class="icon-btn" onclick="closeFlow()">${icon('back',18)}</button>
      <span class="eyebrow">Journal</span>

    </div>

      <div class="searchbar">
        ${icon('search',17)}

      </div>
      <div class="chips" style="margin-bottom:16px">
        ${filters.map(f=>`<button class="chip ${journalFilter===f?'on':''}" onclick="journalSetFilter('${f}')">${f}</button>`).join('')}

}
function journalSearch(v){
  journalQuery = v;

}
function journalSetFilter(f){ journalFilter=f; setFlow(journalHTML()); }

function openEntry(id){

function newEntry(){
  openSheet(`

}

/* ============================================================

function openRafiki(){
  openSheet(rafikiHTML());
  setTimeout(()=>{ const b=el('rafikiBody'); if(b) b.scrollTop = b.scrollHeight; }, 60);
}
function rafikiHTML(){
  const m = metrics();
  const intro = `Hey ${S.name}, I'm Rafiki. I'm here to help you see clearly, act truthfully, and build trust.`;
  return `
    <div class="rafiki-msg">
      <span class="rafiki-av">${icon('hand',19)}</span>
      <div><div class="bubble">${intro}</div></div>
    </div>
    <div id="rafikiBody" style="max-height:34vh;overflow-y:auto;margin-bottom:6px">
      ${S.rafiki.map(m=>m.me
        ? `<div class="bubble me" style="margin-bottom:12px">${escapeHTML(m.text)}</div>`
        : `<div class="rafiki-msg"><span class="rafiki-av">${icon('hand',19)}</span><div><div class="bubble">${m.text}</div></div></div>`
      ).join('')}
    </div>
    ${S.rafiki.length?'':RAFIKI_SUGGEST.map(s=>`<button class="suggest" onclick="askRafiki('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}
    <div class="composer" style="margin-top:10px">
      <input id="rafikiInput" placeholder="Ask Rafiki anything…" onkeydown="if(event.key==='Enter')askRafiki(this.value)">
      <button class="send" onclick="askRafiki(el('rafikiInput').value)">${icon('arrow',17)}</button>
    </div>
    <p class="tiny muted" style="text-align:center;margin-top:12px">Rafiki is scripted in this preview. Live guidance connects to the model in the shipped app.</p>`;
}
function escapeHTML(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function askRafiki(text){
  text = (text||'').trim(); if(!text) return;
  S.rafiki.push({me:true, text});
  S.rafiki.push({me:false, text: rafikiReply(text)});
  save();
  openSheet(rafikiHTML());
  setTimeout(()=>{ const b=el('rafikiBody'); if(b) b.scrollTop = b.scrollHeight; }, 60);
}
function rafikiReply(q){
  const t = q.toLowerCase(), m = metrics();
  if(/soil|urgen|pressure/.test(t))
    return `Start with the check: is it real, whose is it, what is beneath it, and what does responding cost? You have avoided unnecessary urgency ${m.avoided} time${m.avoided===1?'':'s'} recently — the same discernment applies here.`;
  if(/pattern|see/.test(t))
    return derivePatterns()[0] + ' Watch for where speed is standing in for a conversation you have not had yet.';
  if(/repair|relationship|trust/.test(t))
    return 'Repair has a sequence: stop, see, own, repair, sow. Skip ownership and the repair reads as management. Name your part first, without explaining it away.';
  if(/prepare|conversation|meeting/.test(t))
    return 'Before you speak, settle three things: the observation you can state without interpretation, the one question that could genuinely change your mind, and the by-when you are asking for.';
  if(/week|summar|progress/.test(t))
    return `This week: ${m.loopsWeek} loop${m.loopsWeek===1?'':'s'} closed, alignment at ${m.alignment}%, and ${m.avoided} unnecessary-urgency moment${m.avoided===1?' caught before it cost you':'s caught before they cost you'}. You practiced on ${m.rhythmDays} of the last 7 days. Your growth edge is ${Object.entries(S.skills).sort((a,b)=>a[1]-b[1])[0][0]}.`;
  return 'Say more about the moment itself — what happened, who was in it, and what you felt pulled to do first. The pull is usually the most useful clue.';
}
