<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Center of Success</title>
<style>
:root{--ink:#1C1B19;--parchment:#FAF7F0;--clay:#8C3B2E;--moss:#4A5A40;--gold:#B8892B;--line:rgba(28,27,25,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--parchment);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}h1,h2,h3,.display{font-family:Georgia,"Times New Roman",serif}header{position:sticky;top:0;z-index:10;background:rgba(250,247,240,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}.header-inner{max-width:900px;margin:auto;padding:12px 16px}.brand{font-size:18px;font-weight:700;margin-bottom:8px}nav{display:flex;gap:6px;overflow-x:auto}nav button{border:0;background:none;padding:7px 11px;border-radius:999px;white-space:nowrap;color:var(--ink);opacity:.65;font-size:13px}nav button.active{background:var(--ink);color:var(--parchment);opacity:1}main{max-width:900px;margin:auto;padding:24px 16px 64px}.view{display:none}.view.active{display:block}.hero{text-align:center;padding:22px 0 30px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--clay);margin:0 0 8px}.hero h1{font-size:34px;line-height:1.15;margin:0 0 12px}.muted{color:rgba(28,27,25,.64)}.small{font-size:13px}.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:rgba(255,255,255,.48)}.grid{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}.link-card{cursor:pointer;transition:.15s}.link-card:hover{border-color:var(--clay);transform:translateY(-1px)}.skill-route{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}.skill-name{font-size:20px;margin:0 0 8px}.keychain{color:var(--clay);font-weight:650}.trust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:640px){.trust-grid{grid-template-columns:repeat(4,1fr)}}.trust-step{border:1px solid var(--line);border-radius:10px;padding:11px;background:rgba(255,255,255,.55)}.trust-step strong{color:var(--clay)}.section-title{font-size:25px;margin:0 0 5px}.section-lead{margin:0 0 22px}.key-detail{margin-bottom:26px}.key-detail h2{font-size:23px;margin:0 0 7px}.links{display:grid;gap:8px;margin-top:13px}.practice{display:flex;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px;background:rgba(255,255,255,.35)}.letter{font-family:Georgia,serif;color:var(--clay);font-size:22px;width:24px;flex:0 0 24px}.practice p{margin:2px 0 0}.virtue{font-size:19px;color:var(--clay);margin:0 0 4px}.footer-note{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:13px}.btn{border:0;border-radius:999px;background:var(--clay);color:var(--parchment);padding:10px 16px;font-size:14px;cursor:pointer}.prompt{font-size:17px;font-style:italic;margin:8px 0 14px}.practice-today{margin-bottom:24px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;margin:3px 3px 0 0}.glossary dt{font-family:Georgia,serif;font-size:17px}.glossary dd{margin:4px 0 17px;color:rgba(28,27,25,.7);font-size:14px}
</style>
</head>
<body>
<header><div class="header-inner"><div class="brand">Center of Success</div><nav id="nav"></nav></div></header>
<main id="main"></main>
<script>
const skills=[
{name:'Communication',route:'Confusion → Clarity',promise:'We can say what matters, hear what is meant, and move with shared understanding.',chains:[['SpeakUp!','SPEAK',[['S','Start with Story'],['P','Package for People'],['E','Engage the Environment'],['A','Action: Take Action'],['K','Keynote']]],['ListenUp!','LISTEN',[['L','Lean In'],['I','Inquire'],['S','Suspend Assumptions'],['T','Track Meaning'],['E','Empathize'],['N','Name What You Heard']]]]},
{name:'Energy',route:'Fear → Drive',promise:'We can act with courage and sustain what matters.',chains:[['PowerUp!','POWER',[['P','Presence'],['O','Ownership'],['W','Will'],['E','Engineer'],['R','Rhythm']]]]},
{name:'Network',route:'Isolation → Connection',promise:'We can give and receive the support needed to succeed.',chains:[['LinkUp!','LINK',[['L','Look'],['I','Interview'],['N','Needs Assessment'],['K','Keep']]]]},
{name:'Teamwork',route:'Division → Unity',promise:'We can combine our contributions and win together.',chains:[['TeamUp!','TEAM',[['T','Target the Shared Aim'],['E','Engage Every Role'],['A','Align Contributions'],['M','Move Together']]]]},
{name:'Explore',route:'Doubt → Discovery',promise:'We can move through what we do not know and discover a way forward.',chains:[['GearUp!','GEAR',[['G','Generate'],['E','Evaluate'],['A','Assess'],['R','Reflect']]]]},
{name:'Respect',route:'Contempt → Honor',promise:'We can address truth and responsibility without diminishing one another.',chains:[['StepUp!','STEP',[['S','See the Person'],['T','Tell the Truth with Care'],['E','Establish Responsibility'],['P','Proceed with Dignity']]]]}];
const virtues=[['Respect + Communication','Honor','Transparent truthfulness with reverence for persons.'],['Communication + Energy','Strength','Reliable follow-through: clarity translated into sustained, ethical action.'],['Energy + Network','Courage','Mobilized connection in the face of risk.'],['Network + Teamwork','Generosity','Structured sharing of resources, credit, access, and opportunity so the whole rises.'],['Teamwork + Explore','Patience','Disciplined timing that allows learning, people, and shared work to mature.'],['Explore + Respect','Peace','Ordered openness: engaging uncertainty without losing the center.']];
const glossary=[['Alignment','The correspondence of story, words, actions, responsibility, mission, and becoming.'],['Character','The formed center that governs how a person carries power, pressure, responsibility, freedom, conflict, opportunity, and success.'],['CircleUp','The communal rehearsal of Center of Success.'],['CORE Work','The personal rehearsal of Center of Success.'],['Keychain','A mnemonic practice pathway attached to a Center Skill.'],['LevelUp','The integration movement through which neighboring Skills become virtue and virtue becomes character.'],['Service','The mission-shaped expression of character for the good of others; a mission, not a virtue.'],['Trust','Relational confidence produced when integrity and accountability are practiced over time.']];
const views=[['dashboard','Dashboard'],['keys','Six Keys'],['levelup','LevelUp'],['glossary','Glossary']];let current='dashboard';
function nav(){const n=document.getElementById('nav');n.innerHTML=views.map(v=>`<button data-view="${v[0]}" class="${current===v[0]?'active':''}">${v[1]}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.view;render()})}
function dashboard(){const s=skills[(Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000))%skills.length];return `<section class="hero"><p class="eyebrow">Center of Success</p><h1>When character leads,<br>success follows.</h1><p class="muted">Success is alignment—between what you say, what you do, what you become, and what you serve.</p></section><section class="card practice-today"><p class="eyebrow" style="color:var(--moss)">Today's Practice</p><p class="small muted">${s.name} · ${s.route}</p><h2 style="margin:0 0 8px">Practice the ${s.name} Key</h2><p class="prompt">“What would trustworthy movement look like today?”</p><button class="btn" onclick="current='keys';render()">Explore the Six Keys</button></section><div class="grid">${skills.map(s=>`<article class="card link-card" onclick="current='keys';render();setTimeout(()=>document.getElementById('${s.name}').scrollIntoView(),0)"><p class="skill-route muted">${s.route}</p><h3 class="skill-name">${s.name}</h3><p class="small">${s.promise}</p><p class="small keychain">${s.chains.map(c=>`${c[0]} (${c[1]})`).join(' + ')}</p></article>`).join('')}</div><section class="footer-note"><h3>The Trust Loop</h3><div class="trust-grid">${[['Say','Make the commitment clear.'],['Do','Translate it into action.'],['Did','Face what actually happened.'],['Said','Report truthfully and repair.']].map(x=>`<div class="trust-step"><strong>${x[0]}</strong><p class="small muted">${x[1]}</p></div>`).join('')}</div><p class="small muted">Trust = Integrity × Accountability. Integrity is Say → Do. Accountability is Did → Said.</p></section>`}
function keys(){return `<h1 class="section-title">The Six Keys to Success</h1><p class="section-lead muted">Each Key names a trainable capacity. Trust is the power that activates it.</p>${skills.map(s=>`<section class="card key-detail" id="${s.name}"><p class="skill-route muted">${s.route}</p><h2>${s.name}</h2><p>${s.promise}</p>${s.chains.map(c=>`<h3>${c[0]} <span class="muted">— ${c[1]}</span></h3><div class="links">${c[2].map(l=>`<div class="practice"><div class="letter">${l[0]}</div><div><strong>${l[1]}</strong><p class="small muted">A practical link in the ${c[0]} pathway.</p></div></div>`).join('')}</div>`).join('')}</section>`).join('')}`}
function levelup(){return `<h1 class="section-title">LevelUp & the Compass of Character</h1><p class="section-lead muted">Skills train practices. LevelUp integrates practices. The Compass names the virtues being formed.</p><div class="grid">${virtues.map(v=>`<article class="card"><p class="small muted">${v[0]}</p><p class="display virtue">${v[1]}</p><p class="small">${v[2]}</p></article>`).join('')}</div><section class="footer-note"><span class="pill">Honor + Strength → Stability</span><span class="pill">Strength + Courage → Leverage</span><span class="pill">Courage + Generosity → Sacrifice</span><span class="pill">Generosity + Patience → Grace</span><span class="pill">Patience + Peace → Serenity</span><span class="pill">Peace + Honor → Dignity</span></section>`}
function glossaryView(){return `<h1 class="section-title">Glossary</h1><dl class="glossary">${glossary.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl>`}
function render(){nav();document.getElementById('main').innerHTML=current==='dashboard'?dashboard():current==='keys'?keys():current==='levelup'?levelup():glossaryView();scrollTo(0,0)}render();
</script>
</body>
</html>
